<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedidos | Pymedesk</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main><header><div><small>PYMEDESK</small><h1>Gestión de pedidos</h1><p>Consulta y actualiza el estado de los pedidos.</p></div><span id="count"></span></header>
<div id="alert" class="alert hidden" role="alert"></div>
<section><div class="scroll"><table><thead><tr><th>ID</th><th>Cliente</th><th>Total</th><th>Estado</th><th>Acción</th></tr></thead><tbody id="orders"><tr><td colspan="5">Cargando pedidos…</td></tr></tbody></table></div></section></main>
<script>
const body = document.querySelector("#orders");
const count = document.querySelector("#count");
const alertBox = document.querySelector("#alert");
const money = new Intl.NumberFormat("es-CO", {style:"currency",currency:"COP",maximumFractionDigits:0});

function showAlert(message, type = "error") {
  alertBox.textContent = message;
  alertBox.className = `alert alert-${type}`;
}

function clearAlert() {
  alertBox.textContent = "";
  alertBox.className = "alert hidden";
}

async function loadOrders() {
  try {
    const response = await fetch("/api/orders");
    if (!response.ok) throw new Error();
    const orders = await response.json();
    count.textContent = orders.length + " pedidos";
    body.replaceChildren();
    for (const order of orders) {
      const row = document.createElement("tr");
      for (const value of [order.id, order.customer, money.format(order.total)]) {
        const cell = document.createElement("td"); cell.textContent = value; row.append(cell);
      }
      const status = document.createElement("td");
      const badge = document.createElement("span");
      badge.className = "badge " + order.status; badge.textContent = order.status;
      status.append(badge); row.append(status);
      const action = document.createElement("td");
      const button = document.createElement("button");
      button.textContent = "Marcar como enviado";
      button.disabled = order.status === "enviado";
      button.onclick = () => ship(order.id, button);
      action.append(button); row.append(action); body.append(row);
    }
  } catch {
    body.innerHTML = '<tr><td colspan="5">No se pudieron cargar los pedidos. Recarga la página.</td></tr>';
  }
}
async function ship(id, button) {
  button.disabled = true;
  clearAlert();
  try {
    const response = await fetch(`/api/orders/${id}/ship`, {method:"POST"});
    if (!response.ok) {
      let message = "No se pudo actualizar el pedido.";
      try {
        const data = await response.json();
        if (data && data.error) {
          message = data.error;
        }
      } catch {
        // En caso de respuesta sin formato JSON
      }
      showAlert(message, "error");
      button.disabled = false;
      return;
    }
    clearAlert();
    await loadOrders();
  } catch {
    showAlert("Error de conexión: no fue posible comunicarse con el servidor.", "error");
    button.disabled = false;
  }
}
loadOrders();
</script>
</body></html>
